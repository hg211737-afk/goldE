      // Suppress benign [vite] websocket connection retry warnings in AI Studio preview sandbox

        const origError = console.error;

          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket connection to') || args[0].includes('failed to connect to websocket'))) {

            return;
          }
          origError.apply(console, args);
