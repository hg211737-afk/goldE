name: Build Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'نوع البناء (Build Type)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build Web Frontend Assets
        run: |
          npm run build:client

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APKs with Gradle
        run: |
          cd android
          if [ "${{ github.event.inputs.buildType }}" == "release" ]; then
            ./gradlew assembleRelease --stacktrace
          elif [ "${{ github.event.inputs.buildType }}" == "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GoldOrderFlow-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GoldOrderFlow-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
