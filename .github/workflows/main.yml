name: Build Android APK (توليد تطبيق أندرويد)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      buildType:
        description: 'نوع البناء (Build Type)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build:client

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor Android Project
        run: |
          # التأكد من وجود ملف إعداد كاباسيتور
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.goldorderflow.app","appName":"Gold OrderFlow Pro","webDir":"dist"}' > capacitor.config.json
          fi
          
          # إنشاء مجلد أندرويد إذا لم يكن موجوداً ثم المزامنة
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          
          # منح صلاحية التنفيذ لـ gradlew
          chmod +x android/gradlew
          ls -la android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          if [ "${{ github.event.inputs.buildType }}" == "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldOrderFlow-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
