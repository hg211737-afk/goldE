name: Build Android APK (اندرويد توليد ملف APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'نوع البناء (Build Type)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Frontend Assets
        run: npm run build:client

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Recreate Clean Android Project
        run: |
          # احذف المجلد الخربان القديم نهائيا
          rm -rf android
          # انشئه من جديد نظيف
          npx cap add android
          npx cap sync android
          echo "--- تأكد gradlew موجود ---"
          ls -lh android/ | grep gradle

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldOrderFlow-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
