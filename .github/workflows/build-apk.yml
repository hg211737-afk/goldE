name: Build Android APK (اندرويد توليد ملف APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'نوع البناء (Build Type)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Frontend Assets
        run: |
          npm run build:client
          ls -la
          ls -la dist || ls -la build || ls -la www || echo "no build folder"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Initialize or Sync Capacitor Android Project
        run: |
          # لو ما في مجلد اندرويد انشئه
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "--- محتويات مجلد android ---"
          ls -la android/
          ls -la android/app/ || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ls -la gradlew
          if [ "${{ github.event.inputs.buildType }}" == "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldOrderFlow-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
